<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/2-pokeBuscador.css" />
  <title>Poke-Buscador</title>
  <link rel="icon" type="image/png" href="assets/images/Logo_Activando_El_Coeficiente_Intelectual_Tab.png" />
</head>

<body>
  <div class="card">
    <input type="text" id="pokeInput" placeholder="Nombre Pokémon...">
    <button id="btnBuscar">Buscar</button>
    <div id="result">
      <div class="image">
        <img id="img" src="">
      </div>
      <h2 id="name">Busca tu pokémon</h2>
      <div class="stats" id="stats">
        <p>HP: <span id="hp"></span></p>
        <p>Ataque: <span id="atk"></span></p>
        <p>Defensa: <span id="defense"></span></p>
        <p>Velocidad: <span id="spd"></span></p>
        <p>Tipo: <span id="type"></span></p>
        <p>Altura: <span id="height"></span></p>
        <p>Peso: <span id="weight"></span></p>
        <p>Abilidad: <span id="ability"></span></p>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/2-pokeBuscador.js"></script>
</body>

</html>
